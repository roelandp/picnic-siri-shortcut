[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "picnic-service"
version = "0.0.1"
description = "Boodschappen in je Picnic-mandje met Siri: eigen dienst plus iOS-opdrachten"
readme = "README.md"
license = "MIT"
# python-picnic-api2 2.x vereist Python 3.13
requires-python = ">=3.13"
dependencies = [
    # Exact gepind: dit is de enige koppeling met Picnic. requests komt via de wrapper mee.
    "python-picnic-api2==2.0.1",
    "python-dotenv==1.2.3",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
picnic = "picnic_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
picnic_service = ["terms.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
